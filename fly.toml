# Fly.io: `fly launch --no-deploy --copy-config`, then:
#   fly volumes create data --size 1
#   fly secrets set TICKET_SECRET=<random-32+-chars> SIGNUP_CODE=<code-for-organizers>
#   fly deploy
# Optional, for Google Calendar: fly secrets set GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... PUBLIC_URL=https://YOUR-APP.fly.dev
# Optional, for emailing event reports: fly secrets set SMTP_URL=smtps://user:pass@host:465 MAIL_FROM="bọyọ <reports@yourdomain.com>"
# To let anyone create an organizer account instead of using a code:
#   fly secrets set ALLOW_PUBLIC_SIGNUP=true   (and leave SIGNUP_CODE unset)
app = "boyo"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
